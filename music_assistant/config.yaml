name: Music Assistant
version: "2.10.6-haLightsSync5"
slug: music_assistant
description: >-
  Music Assistant 2.10.6 with the ha-lights-sync plugin
  (https://github.com/zachfeldman/ha-lights-sync) baked in via
  music-assistant-plugin-manager, replacing the official Music Assistant
  app as the permanent instance. Migrated from the official app's own
  /data on 2026-10-04 (library, Spotify/Sendspin/Cast state, playlists,
  settings) via a one-time copy wired into the entrypoint - see this
  repo's README for how and why (the official app couldn't run a custom
  plugin without this fork; Supervisor's backup/restore can't move data
  between differently-slugged add-ons, so the migration is a direct copy
  through the shared `backup` mount instead). The `backup:rw` map and the
  migration step are temporary and get removed once the migration is
  confirmed stable - see the TODO in Dockerfile.
url: https://github.com/zachfeldman/ha-music-assistant-kasa-addon
arch:
  - amd64
  - aarch64
homeassistant_api: true
hassio_api: true
hassio_role: manager
discovery:
  - music_assistant
auth_api: true
host_network: true
ingress: true
ingress_port: 8094
audio: true
panel_icon: mdi:music-assistant
panel_title: Music Assistant
panel_admin: false
uart: false
apparmor: true
map:
  - media:rw
  - ssl:ro
  - backup:rw
init: false
stage: stable
tmpfs: true
backup_exclude:
  - cache.db
  - collage_images/*
  - .cache/*
options:
  log_level: info
  safe_mode: false
schema:
  # "verbose" added locally (upstream only offers debug/info/warning/error) -
  # Music Assistant's own --log-level accepts it (see music_assistant/__main__.py)
  # and it's the only way to see protocol-selection decisions logged at
  # VERBOSE_LOG_LEVEL=5, below DEBUG=10 - needed to diagnose the Sendspin
  # grouping bug, see Dockerfile. Safe to drop back to the upstream 4 once
  # that's resolved.
  log_level: list(debug|info|warning|error|verbose)
  safe_mode: bool
